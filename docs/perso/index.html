<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes cartes personnelles</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Mes cartes personnelles">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#1f2933;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:28px 20px;color:#fff;text-align:center;background:linear-gradient(135deg,#1e3a5f,#2b6cb0)}
header h1{margin:0 0 4px;font-size:24px}
header p{margin:0;opacity:.85}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:960px;margin:24px auto;padding:0 16px}
.carte{display:block;background:#fff;border-radius:12px;padding:18px;color:inherit;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.12);border-top:5px solid #2b6cb0;transition:transform .15s,box-shadow .15s}
.carte:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.18)}
.carte h2{margin:0 0 6px;font-size:18px}
.carte p{margin:0}
.carte .etat{color:#52606d;font-size:14px}
.carte .depart{margin:-2px 0 6px;color:#2b6cb0;font-size:13px;font-weight:600}
.podium{list-style:none;margin:10px 0 0;padding:8px 10px;background:#f7f9fb;border-radius:8px;display:flex;flex-direction:column;gap:4px}
.podium li{display:flex;align-items:baseline;gap:8px;font-size:14px}
.podium .med{flex:none;font-size:16px}
.podium .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .nom b{font-weight:600}
.podium i{flex:none;font-style:normal;color:#6b7785;font-size:13px;font-variant-numeric:tabular-nums}
.podium.vide{display:block;font-style:italic;color:#6b7785;font-size:14px}
footer{text-align:center;color:#6b7785;font-size:12px;padding:8px 16px 28px}
</style>
</head>
<body>
<header><h1>Mes cartes personnelles</h1><p>Suivi des courses de Travel Bugs</p></header>
<main>

<a class="carte" href="tb-dc72300.html"><h2>Travel Bugs de DC72300</h2><p>3 TB &middot; 557 étapes</p></a>
<a class="carte" href="tb-test.html"><h2>Carte de test</h2><p>2 TB &middot; 456 étapes</p></a>
</main>
<footer>Mis à jour le 21/10/2026 par Thomas CARRE (carreth)<br>Fonds de carte : OpenStreetMap, OpenTopoMap, Esri</footer>
</body>
</html>
