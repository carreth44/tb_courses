820083333333336, "lon": -3.510483333333333, "j": 20020}, {"gc": "GC7VZZ8", "cache": "Étang du TOURONY BONUS 🦆💕🎣🎨400éme Chup'a Pose", "date": "25/10/2024", "action": "kangxi took Trackable by PyPa to Étang du TOURONY BONUS 🦆💕🎣🎨400éme Chup'a Pose", "lat": 48.82711666666667, "lon": -3.499433333333333, "j": 20021}, {"gc": "GC6QRE8", "cache": "ILE GRANDE, PLAGE DE PORS GWENN", "date": "25/10/2024", "action": "kangxi took Trackable by PyPa to ILE GRANDE, PLAGE DE PORS GWENN", "lat": 48.804383333333334, "lon": -3.5780333333333334, "j": 20021}, {"gc": "GC6X6DE", "cache": "Plage de Grannec - 100éme de Chup'a", "date": "26/10/2024", "action": "kangxi took Trackable by PyPa to Plage de Grannec - 100éme de Chup'a", "lat": 48.82096666666666, "lon": -3.5273333333333334, "j": 20022}, {"gc": "GC7778D", "cache": "Morceau de sabre de Jedi", "date": "26/10/2024", "action": "kangxi took Trackable by PyPa to Morceau de sabre de Jedi", "lat": 48.81975, "lon": -3.5285666666666664, "j": 20022}, {"gc": "GC8DJAV", "cache": "Hisséo * 9 : le trésor de La Buse", "date": "26/10/2024", "action": "kangxi took Trackable by PyPa to Hisséo * 9 : le trésor de La Buse", "lat": 48.85, "lon": -3.51625, "j": 20022}, {"gc": "GC7779J", "cache": "Gourmands sont les Géocacheurs", "date": "26/10/2024", "action": "kangxi took Trackable by PyPa to Gourmands sont les Géocacheurs", "lat": 48.81815, "lon": -3.5290333333333335, "j": 20022}, {"gc": "GC6X6CM", "cache": "Pin de Grannec", "date": "26/10/2024", "action": "kangxi took Trackable by PyPa to Pin de Grannec", "lat": 48.8202, "lon": -3.5237333333333334, "j": 20022}, {"gc": "GC6X6QM", "cache": "La Multi de Bringwiller", "date": "26/10/2024", "action": "kangxi took Trackable by PyPa to La Multi de Bringwiller", "lat": 48.81865, "lon": -3.518466666666667, "j": 20022}, {"gc": "GC62BTM", "cache": "La multi de Toull Bihan", "date": "27/10/2024", "action": "kangxi took Trackable by PyPa to La multi de Toull Bihan", "lat": 48.82366666666667, "lon": -3.52435, "j": 20023}, {"gc": "GC63H61", "cache": "La Multi de l'île Tanguy de Trégastel", "date": "27/10/2024", "action": "kangxi placed Trackable by PyPa in La Multi de l'île Tanguy de Trégastel", "lat": 48.82513333333333, "lon": -3.531633333333333, "j": 20023}], "km": 2466}], "classement": false};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lienGC = gc => '<a href="https://coord.info/' + esc(gc) + '" target="_blank" rel="noopener">' + esc(gc) + '</a>';

const map = L.map('map');
const osm = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const fonds = {
  'OSM France': L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {attribution: osm + ' France', subdomains: 'abc', maxZoom: 20}),
  'Relief': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {attribution: osm + ', SRTM &middot; &copy; OpenTopoMap', subdomains: 'abc', maxZoom: 17}),
  'Satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {attribution: 'Tiles &copy; Esri', maxZoom: 19})
};
fonds['OSM France'].addTo(map);
L.control.layers(fonds).addTo(map);

function popupEtape(titre, e) {
  return '<div class="pop"><h3>' + esc(titre) + '</h3>GC : ' + lienGC(e.gc) + '<br>Cache : ' + esc(e.cache) +
         '<br>Date : ' + esc(e.date) + '<br>Action : ' + esc(e.action) + '</div>';
}
function popupActuel(tb) {
  const e = tb.actuel;
  const ligneClassement = DATA.classement ? '<br>Classement : ' + statut(tb) : '';
  return '<div class="pop"><h3>' + esc(tb.label) + '</h3>TB : ' + esc(tb.code) +
         (tb.nom ? '<br>Nom : ' + esc(tb.nom) : '') + '<br>Owner : ' + esc(tb.owner) + ligneClassement +
         '<br>GC : ' + lienGC(e.gc) + '<br>Cache : ' + esc(e.cache) + '<br>Date : ' + esc(e.date) + '</div>';
}

const MEDAILLES = {1: '&#129351;', 2: '&#129352;', 3: '&#129353;'};
function badge(tb) {
  if (tb.rang == null) return '<div class="rang" title="Pas encore r&eacute;cup&eacute;r&eacute;">&hellip;</div>';
  return '<div class="rang r' + Math.min(tb.rang, 4) + '">' + (MEDAILLES[tb.rang] || tb.rang) + '</div>';
}
function statut(tb) {
  return tb.rang == null ? 'En course'
    : esc(tb.rang_txt) + ' &middot; r&eacute;cup&eacute;r&eacute; le ' + esc(tb.recup);
}

const tous = [];
const elements = [];   // un par TB : couches Leaflet, fiche, case à cocher
const liste = document.getElementById('liste');
const caseMaitre = document.getElementById('tout');

DATA.tbs.forEach(tb => {
  const groupe = L.layerGroup().addTo(map);
  const pts = tb.etapes.map(e => [e.lat, e.lon]);
  pts.forEach(p => tous.push(p));

  const ligne = L.polyline(pts, {color: tb.couleur, weight: 2, opacity: 0.85}).addTo(groupe);

  const points = tb.etapes.slice(0, -1).map((e, i) => {
    const titre = (i + 1) + ' - ' + e.cache;
    return L.circleMarker([e.lat, e.lon], {radius: 4, color: '#fff', weight: 1, fillColor: tb.couleur, fillOpacity: 1})
      .bindTooltip(esc(titre)).bindPopup(popupEtape(titre, e)).addTo(groupe);
  });

  const a = tb.actuel;
  const etoile = L.divIcon({className: '', iconSize: [20, 20], iconAnchor: [10, 10],
    html: '<div class="star" style="background:' + tb.couleur + '">&#9733;</div>'});
  // Étoile hors du groupe du TB : c'est majEtoiles() qui la place (seule,
  // regroupée avec d'autres dans une pastille, ou dépliée en éventail)
  const marqueur = L.marker([a.lat, a.lon], {icon: etoile, zIndexOffset: 1000})
    .bindTooltip(esc(tb.label)).bindPopup(popupActuel(tb));

  const carte = document.createElement('div');
  carte.className = 'tb';
  carte.style.setProperty('--c', tb.couleur);
  const badgeHtml = DATA.classement ? badge(tb) : '';
  const statutHtml = DATA.classement ? '<small class="statut">' + statut(tb) + '</small>' : '';
  carte.innerHTML = badgeHtml + '<div class="txt"><b>' + esc(tb.nom || tb.code) +
    '</b>' + statutHtml + '<small>' + esc(tb.code) + ' &middot; ' + esc(tb.owner) +
    '</small><small>&#128205; ' + esc(a.cache) + ' &middot; ' + esc(a.date) + '</small><small>' +
    tb.etapes.length + ' &eacute;tapes &middot; ' + tb.km.toLocaleString('fr-FR') + ' km</small></div><input type="checkbox" checked title="Afficher / masquer">';
  const cb = carte.querySelector('input');
  // n : nombre d'étapes affichées (toutes, sauf si la chronologie recule)
  const el = {tb, groupe, ligne, points, marqueur, carte, cb, pts, n: pts.length};
  elements.push(el);

  cb.addEventListener('click', ev => ev.stopPropagation());
  cb.addEventListener('change', () => {
    cb.checked ? groupe.addTo(map) : map.removeLayer(groupe);
    majCaseMaitre();
    majEtoiles();
  });
  carte.addEventListener('click', () => {
    if (!cb.checked) { cb.checked = true; groupe.addTo(map); majCaseMaitre(); }
    if (!el.n) { majEtoiles(); map.flyTo([a.lat, a.lon], Math.max(map.getZoom(), 9)); return; }
    ouvert = cle(el);   // si d'autres TB sont au même endroit : éventail déplié
    majEtoiles();
    map.flyTo(pts[el.n - 1], Math.max(map.getZoom(), 9));
    marqueur.openPopup();
  });

  // Survol de la fiche ou de la trace : ce TB ressort, les autres pâlissent.
  // Clic sur un élément de la carte : la fiche correspondante clignote.
  carte.addEventListener('mouseenter', () => surligner(el));
  carte.addEventListener('mouseleave', () => surligner(null));
  ligne.on('mouseover', () => surligner(el)).on('mouseout', () => surligner(null));
  [ligne, marqueur, ...points].forEach(c => c.on('click', () => montrerFiche(el)));

  liste.appendChild(carte);
});

function surligner(cible) {
  elements.forEach(e => {
    const pale = cible && e !== cible;
    e.ligne.setStyle({weight: e === cible ? 4 : 2, opacity: pale ? 0.15 : 0.85});
    e.points.forEach(p => p.setStyle({opacity: pale ? 0.2 : 1, fillOpacity: pale ? 0.2 : 1}));
    e.marqueur.setOpacity(pale ? 0.35 : 1);
  });
  if (cible) cible.ligne.bringToFront();
}

function montrerFiche(el) {
  el.carte.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  el.carte.classList.remove('flash');
  void el.carte.offsetWidth;   // relance l'animation même si elle tourne déjà
  el.carte.classList.add('flash');
}

// Case maître : cochée = tous visibles, vide = aucun, "mixte" sinon
function majCaseMaitre() {
  const n = elements.filter(e => e.cb.checked).length;
  caseMaitre.checked = n === elements.length;
  caseMaitre.indeterminate = n > 0 && n < elements.length;
}
caseMaitre.addEventListener('change', () => {
  const visible = caseMaitre.checked;
  elements.forEach(({cb, groupe}) => {
    cb.checked = visible;
    visible ? groupe.addTo(map) : map.removeLayer(groupe);
  });
  caseMaitre.indeterminate = false;
  majEtoiles();
});

// --- Étoiles au même endroit : une pastille aux couleurs des TB avec leur
// nombre ; un clic la déplie en éventail autour du point réel, un clic sur
// le point central (ou ailleurs sur la carte) la replie. ------------------
const coucheEtoiles = L.layerGroup().addTo(map);
let decor = [];       // pastilles, pivots et traits : recréés à chaque mise à jour
let ouvert = null;    // clé de la position dépliée
const cle = el => el.n ? el.pts[el.n - 1].map(x => x.toFixed(5)).join(',') : null;

function majEtoiles() {
  decor.forEach(c => coucheEtoiles.removeLayer(c));
  decor = [];

  const groupes = new Map();
  elements.forEach(el => {
    const k = el.cb.checked ? cle(el) : null;
    if (!k) { coucheEtoiles.removeLayer(el.marqueur); return; }
    if (!groupes.has(k)) groupes.set(k, []);
    groupes.get(k).push(el);
  });

  groupes.forEach((els, k) => {
    const centre = L.latLng(els[0].pts[els[0].n - 1]);
    if (els.length === 1) {
      els[0].marqueur.setLatLng(centre);
      coucheEtoiles.addLayer(els[0].marqueur);
      return;
    }
    if (k !== ouvert) {
      els.forEach(el => coucheEtoiles.removeLayer(el.marqueur));
      const pas = 100 / els.length;
      const secteurs = els.map((el, i) => el.tb.couleur + ' ' + i * pas + '% ' + (i + 1) * pas + '%').join(',');
      decor.push(L.marker(centre, {zIndexOffset: 2000, icon: L.divIcon({className: '', iconSize: [26, 26], iconAnchor: [13, 13],
          html: '<div class="grappe" style="background:conic-gradient(' + secteurs + ')"><span>' + els.length + '</span></div>'})})
        .bindTooltip(els.length + ' TB ici &middot; cliquer pour d&eacute;plier')
        .on('click', () => { ouvert = k; majEtoiles(); }));
      return;
    }
    // Déplié : étoiles en cercle (rayon en pixels, recalculé à chaque zoom)
    const c = map.latLngToLayerPoint(centre);
    const rayon = Math.max(28, els.length * 24 / (2 * Math.PI));
    decor.push(L.circleMarker(centre, {radius: 3, color: '#333', weight: 1, fillColor: '#fff', fillOpacity: 1})
      .bindTooltip('Replier').on('click', () => { ouvert = null; majEtoiles(); }));
    els.forEach((el, i) => {
      const angle = 2 * Math.PI * i / els.length - Math.PI / 2;
      const pos = map.layerPointToLatLng(c.add(L.point(rayon * Math.cos(angle), rayon * Math.sin(angle))));
      decor.push(L.polyline([centre, pos], {color: '#333', weight: 1, opacity: 0.6, interactive: false}));
      el.marqueur.setLatLng(pos);
      coucheEtoiles.addLayer(el.marqueur);
    });
  });

  decor.forEach(c => coucheEtoiles.addLayer(c));
}

map.on('zoomend', majEtoiles);
map.on('click', () => { if (ouvert) { ouvert = null; majEtoiles(); } });

// --- Chronologie : rejoue les déplacements jusqu'à une date donnée ---------
const jours = DATA.tbs.flatMap(t => t.etapes.map(e => e.j)).filter(j => j != null);
const jMin = Math.min(...jours), jMax = Math.max(...jours);

function afficherJusquAu(j) {
  elements.forEach(el => {
    const etapes = el.tb.etapes;
    let n = 0;
    while (n < etapes.length && etapes[n].j <= j) n++;
    if (n === el.n) return;
    el.n = n;
    el.ligne.setLatLngs(el.pts.slice(0, n));
    el.points.forEach((p, i) => i < n - 1 ? el.groupe.addLayer(p) : el.groupe.removeLayer(p));
    if (n) el.marqueur.setPopupContent(n === etapes.length ? popupActuel(el.tb)
      : popupEtape(el.tb.label + ' (au ' + dateJour(j) + ')', etapes[n - 1]));
  });
  majEtoiles();   // positions des étoiles et regroupements
}

function dateJour(j) {
  return new Date(j * 864e5).toLocaleDateString('fr-FR', {timeZone: 'UTC'});
}

if (jours.length && jMin < jMax) {
  const Chrono = L.Control.extend({
    onAdd() {
      const div = L.DomUtil.create('div', 'chrono');
      div.innerHTML = '<button type="button" title="Rejouer">&#9654;</button>' +
        '<input type="range" step="1" title="Date"><span></span>';
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    }
  });
  const [bouton, curseur, etiquette] = new Chrono({position: 'bottomleft'}).addTo(map).getContainer().children;
  curseur.min = jMin; curseur.max = jMax; curseur.value = jMax;
  etiquette.textContent = dateJour(jMax);

  const aller = j => { curseur.value = j; etiquette.textContent = dateJour(j); afficherJusquAu(j); };
  let lecture = null;
  const arreter = () => { clearInterval(lecture); lecture = null; bouton.innerHTML = '&#9654;'; };

  curseur.addEventListener('input', () => { arreter(); aller(+curseur.value); });
  bouton.addEventListener('click', () => {
    if (lecture) return arreter();
    if (+curseur.value >= jMax) aller(jMin);
    const pas = Math.max(1, Math.round((jMax - jMin) / 300));   // ~15 s au total
    bouton.innerHTML = '&#10074;&#10074;';
    lecture = setInterval(() => {
      const j = Math.min(jMax, +curseur.value + pas);
      aller(j);
      if (j >= jMax) arreter();
    }, 50);
  });
}

if (tous.length) map.fitBounds(tous, {padding: [30, 30]}); else map.setView([46.6, 2.5], 5);
majEtoiles();   // après la mise en place de la vue (l'éventail travaille en pixels)
</script>
