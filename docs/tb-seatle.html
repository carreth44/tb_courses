const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lienGC = gc => '<a href="https://coord.info/' + esc(gc) + '" target="_blank" rel="noopener">' + esc(gc) + '</a>';

const map = L.map('map');
const osm = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const fonds = {
  'OSM France': L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {attribution: osm + ' France', subdomains: 'abc', maxZoom: 20}),
  'Relief': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {attribution: osm + ', SRTM &middot; &copy; OpenTopoMap', subdomains: 'abc', maxZoom: 17}),
  'Satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {attribution: 'Tiles &copy; Esri', maxZoom: 19})
};
fonds['OSM France'].addTo(map);
L.control.layers(fonds).addTo(map);

function popupEtape(titre, e) {
  return '<div class="pop"><h3>' + esc(titre) + '</h3>GC : ' + lienGC(e.gc) + '<br>Cache : ' + esc(e.cache) +
         '<br>Date : ' + esc(e.date) + '<br>Action : ' + esc(e.action) + '</div>';
}
function popupActuel(tb) {
  const e = tb.actuel;
  return '<div class="pop"><h3>' + esc(tb.label) + '</h3>TB : ' + esc(tb.code) +
         (tb.nom ? '<br>Nom : ' + esc(tb.nom) : '') + '<br>Owner : ' + esc(tb.owner) + '<br>Classement : ' + statut(tb) +
         '<br>GC : ' + lienGC(e.gc) + '<br>Cache : ' + esc(e.cache) + '<br>Date : ' + esc(e.date) + '</div>';
}

const MEDAILLES = {1: '&#129351;', 2: '&#129352;', 3: '&#129353;'};
function badge(tb) {
  if (tb.rang == null) return '<div class="rang" title="Pas encore r&eacute;cup&eacute;r&eacute;">&hellip;</div>';
  return '<div class="rang r' + Math.min(tb.rang, 4) + '">' + (MEDAILLES[tb.rang] || tb.rang) + '</div>';
}
function statut(tb) {
  return tb.rang == null ? 'En course'
    : esc(tb.rang_txt) + ' &middot; r&eacute;cup&eacute;r&eacute; le ' + esc(tb.recup);
}

const tous = [];
const liste = document.getElementById('liste');

DATA.tbs.forEach(tb => {
  const groupe = L.layerGroup().addTo(map);
  const pts = tb.etapes.map(e => [e.lat, e.lon]);
  pts.forEach(p => tous.push(p));

  if (pts.length > 1) L.polyline(pts, {color: tb.couleur, weight: 2, opacity: 0.85}).addTo(groupe);

  tb.etapes.slice(0, -1).forEach((e, i) => {
    const titre = (i + 1) + ' - ' + e.cache;
    L.circleMarker([e.lat, e.lon], {radius: 4, color: '#fff', weight: 1, fillColor: tb.couleur, fillOpacity: 1})
      .bindTooltip(esc(titre)).bindPopup(popupEtape(titre, e)).addTo(groupe);
  });

  const a = tb.actuel;
  const etoile = L.divIcon({className: '', iconSize: [30, 30], iconAnchor: [15, 15],
    html: '<div class="star" style="background:' + tb.couleur + '">&#9733;</div>'});
  const marqueur = L.marker([a.lat, a.lon], {icon: etoile, zIndexOffset: 1000})
    .bindTooltip(esc(tb.label)).bindPopup(popupActuel(tb)).addTo(groupe);

  const carte = document.createElement('div');
  carte.className = 'tb';
  carte.style.setProperty('--c', tb.couleur);
  carte.innerHTML = badge(tb) + '<div class="txt"><b>' + esc(tb.nom || tb.code) +
    '</b><small class="statut">' + statut(tb) + '</small><small>' + esc(tb.code) + ' &middot; ' + esc(tb.owner) +
    '</small><small>&#128205; ' + esc(a.cache) + ' &middot; ' + esc(a.date) + '</small><small>' +
    tb.etapes.length + ' &eacute;tapes</small></div><input type="checkbox" checked title="Afficher / masquer">';
  const cb = carte.querySelector('input');
  cb.addEventListener('click', ev => ev.stopPropagation());
  cb.addEventListener('change', () => cb.checked ? groupe.addTo(map) : map.removeLayer(groupe));
  carte.addEventListener('click', () => {
    if (!cb.checked) { cb.checked = true; groupe.addTo(map); }
    map.flyTo([a.lat, a.lon], Math.max(map.getZoom(), 9));
    marqueur.openPopup();
  });
  liste.appendChild(carte);
});

if (tous.length) map.fitBounds(tous, {padding: [30, 30]}); else map.setView([46.6, 2.5], 5);
